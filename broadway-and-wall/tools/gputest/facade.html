<!doctype html>
<html><head><meta charset="utf-8"><title>facade test</title><style>body{margin:0;background:#888}canvas{display:block}</style></head>
<body>
<script type="module">
import * as THREE from "three/webgpu";
import * as T from "three/tsl";
import { portMaterial } from "/src/map/real/gpu/ports.ts";
const q = new URLSearchParams(location.search);
const W = 800, H = 400;
const canvas = document.createElement("canvas"); document.body.appendChild(canvas);
const renderer = new THREE.WebGPURenderer({ canvas, forceWebGL: q.get("gpu") === "webgl2" });
await renderer.init();
renderer.setSize(W, H, false);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x223344);
scene.add(new THREE.AmbientLight(0xffffff, 2));
const mk = (fill) => { const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"); fill(g); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(0.5, 0.5); return t; };
const alb = mk((g) => { g.fillStyle = "#c0a070"; g.fillRect(0, 0, 256, 256); g.fillStyle = "#202020"; g.fillRect(40, 40, 40, 60); g.fillRect(170, 40, 40, 60); g.fillRect(40, 160, 40, 60); g.fillRect(170, 160, 40, 60); });
alb.colorSpace = THREE.SRGBColorSpace;
const msk = mk((g) => { g.fillStyle = "#000"; g.fillRect(0, 0, 256, 256); g.fillStyle = "rgb(0,255,0)"; g.fillRect(0, 0, 20, 256); g.fillStyle = "rgb(0,0,255)"; g.fillRect(120, 0, 16, 256); });
const orm = mk((g) => { g.fillStyle = "rgb(0,230,0)"; g.fillRect(0, 0, 256, 256); g.fillStyle = "rgb(255,30,0)"; g.fillRect(40, 40, 40, 60); g.fillRect(170, 40, 40, 60); g.fillRect(40, 160, 40, 60); g.fillRect(170, 160, 40, 60); });
const mat = new THREE.MeshStandardMaterial({ map: alb, roughnessMap: orm, metalnessMap: orm, roughness: 1, metalness: 1, emissiveMap: msk, emissive: new THREE.Color(0xffffff), emissiveIntensity: 0, vertexColors: true });
mat.onBeforeCompile = (sh) => { Object.assign(sh.uniforms, { uWin: { value: new THREE.Vector4(0.15, 0.3, 0.2, 0.6) }, uSeed: { value: new THREE.Vector2(1, 2) }, uWallLum: { value: 0.4 }, uTrimLum: { value: 0.4 }, uAccLum: { value: 0.4 }, uGlassy: { value: 0 }, uBay: { value: new THREE.Vector2(4, 3.5) }, uGlassP: { value: new THREE.Vector4(0, 0, 0, 0) }, uReveal: { value: 0.3 } }); };
const geo = new THREE.PlaneGeometry(8, 4, 1, 1);
const n = geo.attributes.position.count;
const set = (name, size, v) => { const a = new Float32Array(n * size); for (let i = 0; i < n; i++) a.set(v, i * size); geo.setAttribute(name, new THREE.BufferAttribute(a, size)); };
set("color", 3, [1, 1, 1]); set("aoh", 1, [3.5]); set("paint", 4, [0.2, 0.4, 0.9, Number(q.get("pa") ?? 1)]); set("trimc", 3, [0.9, 0.1, 0.1]); set("accent", 3, [0.1, 0.9, 0.1]);
// uv repeat across 4 tiles
const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 4, uv.getY(i) * 2);
const shared = { uTone: T.uniform(1), uExposure: T.uniform(0.9), uHazeCol: T.uniform(new THREE.Vector3(0.7, 0.8, 0.9)), uHazeNear: T.uniform(1e5), uHazeFar: T.uniform(2e5), uHazeCap: T.uniform(0), sync: [] };
if (!q.has("stock")) portMaterial(mat, shared, renderer);
if (q.get("dbg") === "mask") mat.colorNode = T.vec4(T.texture(msk, T.uv().mul(0.5)).rgb, 1);
const m1 = new THREE.Mesh(geo, mat); m1.position.y = 1.1; m1.scale.setScalar(0.5); scene.add(m1);
const alb2 = mk((g) => { g.fillStyle = "#802020"; g.fillRect(0, 0, 256, 256); g.fillStyle = "#e0e0e0"; g.fillRect(100, 100, 60, 60); }); alb2.colorSpace = THREE.SRGBColorSpace;
const msk2 = mk((g) => { g.fillStyle = "#000"; g.fillRect(0, 0, 256, 256); g.fillStyle = "rgb(0,0,255)"; g.fillRect(0, 230, 256, 26); });
const mat2 = mat.clone(); mat2.map = alb2; mat2.emissiveMap = msk2; mat2.onBeforeCompile = (sh) => { Object.assign(sh.uniforms, { uWin: { value: new THREE.Vector4(0.15, 0.3, 0.2, 0.6) }, uSeed: { value: new THREE.Vector2(1, 2) }, uWallLum: { value: 0.1 }, uTrimLum: { value: 0.4 }, uAccLum: { value: 0.4 }, uGlassy: { value: 0 }, uBay: { value: new THREE.Vector2(4, 3.5) }, uGlassP: { value: new THREE.Vector4(0, 0, 0, 0) }, uReveal: { value: 0 } }); };
if (!q.has("stock")) portMaterial(mat2, shared, renderer);
const m2 = new THREE.Mesh(geo, mat2); m2.position.y = -1.1; m2.scale.setScalar(0.5); scene.add(m2);
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 100); camera.position.set(0, 0, 5.5);
const pl = new THREE.RenderPipeline(renderer); pl.outputColorTransform = false;
const sp = T.pass(scene, camera);
pl.outputNode = T.vec4(T.sRGBTransferOETF(sp.getTextureNode("output").rgb), 1);
pl.render(); await new Promise((r) => setTimeout(r, 300)); pl.render();
window.__done = true;
</script>
</body></html>
