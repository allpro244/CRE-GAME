<!doctype html>
<html><head><meta charset="utf-8"><title>raw webgpu</title></head>
<body><canvas id="c" width="320" height="200"></canvas>
<script type="module">
const log = (m) => { console.warn("RAW " + m); };
const a = await navigator.gpu.requestAdapter();
log("adapter " + !!a);
const d = await a.requestDevice();
d.lost.then((i) => log("LOST " + i.reason + " " + i.message));
const ctx = document.getElementById("c").getContext("webgpu");
ctx.configure({ device: d, format: navigator.gpu.getPreferredCanvasFormat() });
for (let i = 0; i < 30; i++) {
  const enc = d.createCommandEncoder();
  const p = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), clearValue: { r: 0.2, g: 0.6, b: 0.3, a: 1 }, loadOp: "clear", storeOp: "store" }] });
  p.end(); d.queue.submit([enc.finish()]);
  await new Promise((r) => requestAnimationFrame(r));
}
log("frames done");
window.__done = true;
</script></body></html>
