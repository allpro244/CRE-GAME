<!doctype html>
<html><head><meta charset="utf-8"><title>env test</title><style>body{margin:0;background:#888}canvas{display:block}</style></head>
<body>
<script type="module">
import * as THREE from "three/webgpu";
import * as CL from "three";
import { RoomEnvironment } from "three/examples/jsm/environments/RoomEnvironment.js";
const q = new URLSearchParams(location.search);
const W = 600, H = 300;
const canvas = document.createElement("canvas"); document.body.appendChild(canvas);
const classic = q.has("cls");
const renderer = classic ? new CL.WebGLRenderer({ canvas }) : new THREE.WebGPURenderer({ canvas, forceWebGL: q.get("gpu") === "webgl2" });
if (!classic) await renderer.init();
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const pm = classic ? new CL.PMREMGenerator(renderer) : new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.03).texture;
scene.environmentIntensity = 0.5;
const rs = [0.95, 0.6, 0.3];
rs.forEach((r, i) => { const m = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 24), new THREE.MeshStandardMaterial({ color: 0xb08060, roughness: r, metalness: 0 })); m.position.set(-2.4 + i * 2.4, 0, 0); scene.add(m); });
const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100); camera.position.set(0, 0, 9);
renderer.render(scene, camera);
await new Promise((r) => setTimeout(r, 300));
renderer.render(scene, camera);
window.__done = true;
</script>
</body></html>
