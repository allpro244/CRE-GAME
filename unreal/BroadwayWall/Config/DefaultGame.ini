[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Broadway & Wall

[/Script/UnrealEd.ProjectPackagingSettings]
; the city, kit tables and the game page (Data/web) ship as loose files next to the content
+DirectoriesToAlwaysStageAsNonUFS=(Path="../Data")
; City Sample content is loaded by path at runtime, so the cooker cannot find it by reference
+DirectoriesToAlwaysCook=(Path="/Game")
+MapsToCook=(FilePath="/Engine/Maps/Entry")
BuildConfiguration=PPBC_Development
bUseIoStore=True
bCompressed=True

[/Script/Engine.AssetManagerSettings]
; the GameFeatures plugin (on by default) fails the cook without a rule for its asset type
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
